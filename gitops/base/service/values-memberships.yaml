name: memberships
image:
  repository: ghcr.io/quasar0x/courtside-memberships
  tag: "5784f7b1c5bc2943fdf69629da6db006ad772df2"
env:
  - name: PORT
    value: "8080"
  - name: PGHOST
    valueFrom:
      secretKeyRef:
        name: postgres
        key: PGHOST
  - name: PGPORT
    valueFrom:
      secretKeyRef:
        name: postgres
        key: PGPORT
  - name: PGUSER
    valueFrom:
      secretKeyRef:
        name: postgres
        key: PGUSER
  - name: PGPASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres
        key: PGPASSWORD
  - name: PGSSLMODE
    valueFrom:
      secretKeyRef:
        name: postgres
        key: PGSSLMODE
  - name: PGDATABASE
    value: "memberships"
  - name: KAFKA_BROKER
    value: "kafka:9092"
  - name: OTEL_ENDPOINT
    value: "otel-collector.monitoring:4318"
